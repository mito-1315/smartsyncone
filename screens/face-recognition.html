<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition - SmartSyncOne</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        #video {
            width: 100%;
            max-width: 640px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .back-button {
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .back-button:hover {
            background-color: #545b62;
        }
        .image-container {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }
        .image-container img {
            max-width: 300px;
            height: auto;
        }
        .result-container {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
        }
        .match { color: green; font-weight: bold; }
        .no-match { color: red; font-weight: bold; }
        .loader {
            display: none;
            margin: 20px auto;
            border: 5px solid #f3f3f3;
            border-radius: 50%;
            border-top: 5px solid #3498db;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .comparison-section {
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <video id="video" autoplay></video>
        <button id="capture">Capture Image</button>
        <canvas id="canvas" style="display:none;"></canvas>
        
        <div class="comparison-section">
            <input type="text" id="rollnumber" placeholder="Enter Roll Number">
            <button id="submit">Compare Images</button>
            <div id="loader" class="loader"></div>
            <div class="image-container">
                <img id="capturedImage" style="display: none;" alt="Captured Image">
                <div id="databaseImages"></div>
            </div>
            <div id="result" class="result-container"></div>
        </div>
        <button class="back-button" onclick="window.location.href='/'">Back to Home</button>
    </div>

    <script>
        let stream;
        const imagesDB = [];
        let imageLive = null;

        async function initCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }
                });
                const videoElement = document.getElementById('video');
                videoElement.srcObject = stream;
            } catch (err) {
                console.error("Error accessing camera:", err);
                alert("Error accessing camera. Please make sure you've granted camera permissions.");
            }
        }

        document.getElementById('capture').addEventListener('click', () => {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const capturedImage = document.getElementById('capturedImage');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            imageLive = canvas.toDataURL('image/jpeg');
            capturedImage.src = imageLive;
            capturedImage.style.display = 'block';
        });

        document.getElementById('submit').addEventListener('click', async () => {
            if (!imageLive) {
                alert('Please capture an image first!');
                return;
            }

            const rollNo = document.getElementById('rollnumber').value;
            if (!rollNo) {
                alert('Please enter a roll number!');
                return;
            }

            const resultElement = document.getElementById('result');
            const loaderElement = document.getElementById('loader');
            
            loaderElement.style.display = 'block';
            resultElement.textContent = '';

            try {
                const response = await fetch('/api/compare-faces', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        rollNo,
                        capturedImage: imageLive
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                loaderElement.style.display = 'none';
                
                if (data.success) {
                    const matchClass = data.isMatch ? 'match' : 'no-match';
                    resultElement.innerHTML = `
                        <p class="${matchClass}">Match: ${data.isMatch ? 'Yes' : 'No'}</p>
                        <p>Confidence: ${data.bestMatchPercentage.toFixed(2)}%</p>
                    `;
                } else {
                    resultElement.innerHTML = `<p class="no-match">Verification failed: ${data.error || 'Unknown error'}</p>`;
                }
            } catch (error) {
                console.error('Error:', error);
                resultElement.innerHTML = `<p class="no-match">Error: ${error.message}</p>`;
                loaderElement.style.display = 'none';
            }
        });

        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
