<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Recognition - SmartSyncOne</title>
    <style>
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
        }
        #video {
            width: 100%;
            max-width: 640px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .back-button {
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .back-button:hover {
            background-color: #545b62;
        }
        .image-container {
            margin-top: 20px;
            display: flex;
            gap: 20px;
        }
        .image-container img {
            max-width: 300px;
            height: auto;
        }
        .result-container {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
        }
        .match { color: green; font-weight: bold; }
        .no-match { color: red; font-weight: bold; }
        .loader {
            display: none;
            margin: 20px auto;
            border: 5px solid #f3f3f3;
            border-radius: 50%;
            border-top: 5px solid #3498db;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        .error-message {
            color: red;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid red;
            border-radius: 5px;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .comparison-section {
            margin-top: 30px;
            padding: 20px;
            border-top: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="error-container" class="error-message"></div>
        <video id="video" autoplay playsinline></video>
        <button id="capture">Capture Image</button>
        <canvas id="canvas" style="display:none;"></canvas>
        
        <div class="comparison-section">
            <input type="text" id="rollnumber" placeholder="Enter Roll Number">
            <button id="submit">Compare Images</button>
            <div id="loader" class="loader"></div>
            <div class="image-container">
                <img id="capturedImage" style="display: none;" alt="Captured Image">
                <div id="databaseImages"></div>
            </div>
            <div id="result" class="result-container"></div>
        </div>
        <button class="back-button" onclick="window.location.href='/'">Back to Home</button>
    </div>

    <script>
        let stream;
        const imagesDB = [];
        let imageLive = null;
        let sessionId = '';

        async function initCamera() {
            const videoElement = document.getElementById('video');
            const errorContainer = document.getElementById('error-container');

            try {
                // Check if navigator.mediaDevices exists, if not, create it
                if (!navigator.mediaDevices) {
                    navigator.mediaDevices = {};
                }

                // Check if getUserMedia exists, if not, get legacy method
                if (!navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia = function(constraints) {
                        const getUserMedia = navigator.webkitGetUserMedia || navigator.mozGetUserMedia;
                        
                        if (!getUserMedia) {
                            return Promise.reject(new Error('getUserMedia is not supported in this browser'));
                        }

                        return new Promise((resolve, reject) => {
                            getUserMedia.call(navigator, constraints, resolve, reject);
                        });
                    }
                }

                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: "user",
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                
                videoElement.srcObject = stream;
                errorContainer.style.display = 'none';
                
                // Add play handler
                videoElement.onplay = () => {
                    errorContainer.style.display = 'none';
                };

            } catch (err) {
                console.error("Camera error:", err);
                errorContainer.style.display = 'block';
                
                if (err.name === 'NotAllowedError') {
                    errorContainer.textContent = 'Camera access denied. Please allow camera access in your browser settings and refresh the page.';
                } else if (err.name === 'NotFoundError') {
                    errorContainer.textContent = 'No camera device found. Please make sure your camera is connected.';
                } else if (err.name === 'NotReadableError') {
                    errorContainer.textContent = 'Camera is in use by another application. Please close other applications using the camera.';
                } else {
                    errorContainer.textContent = `Camera error: ${err.message}. Please refresh the page or try a different browser.`;
                }
            }
        }

        // Add cleanup function
        window.addEventListener('beforeunload', () => {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            // Get sessionId from URL
            const urlParams = new URLSearchParams(window.location.search);
            sessionId = urlParams.get('sessionID'); // Changed from sessionId to sessionID
            console.log('Retrieved sessionID from URL:', sessionId);
            
            if (!sessionId) {
                console.warn('No session ID provided in URL parameters');
            }
        });

        document.getElementById('capture').addEventListener('click', () => {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const capturedImage = document.getElementById('capturedImage');
            
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            
            imageLive = canvas.toDataURL('image/jpeg');
            capturedImage.src = imageLive;
            capturedImage.style.display = 'block';
        });

        document.getElementById('submit').addEventListener('click', async () => {
            if (!imageLive) {
                alert('Please capture an image first!');
                return;
            }

            const rollNo = document.getElementById('rollnumber').value;
            if (!rollNo) {
                alert('Please enter a roll number!');
                return;
            }

            const resultElement = document.getElementById('result');
            const loaderElement = document.getElementById('loader');
            
            loaderElement.style.display = 'block';
            resultElement.textContent = '';

            try {
                const response = await fetch('/api/compare-faces', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        rollNo,
                        capturedImage: imageLive,
                        sessionId // Add sessionId to the request
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                loaderElement.style.display = 'none';
                
                if (data.success) {
                    const matchClass = data.isMatch ? 'match' : 'no-match';
                    resultElement.innerHTML = `
                        <p class="${matchClass}">Match: ${data.isMatch ? 'Yes' : 'No'}</p>
                        <p>Confidence: ${data.bestMatchPercentage.toFixed(2)}%</p>
                    `;
                } else {
                    resultElement.innerHTML = `<p class="no-match">Verification failed: ${data.error || 'Unknown error'}</p>`;
                }
            } catch (error) {
                console.error('Error:', error);
                resultElement.innerHTML = `<p class="no-match">Error: ${error.message}</p>`;
                loaderElement.style.display = 'none';
            }
        });

        window.addEventListener('load', initCamera);
    </script>
</body>
</html>
