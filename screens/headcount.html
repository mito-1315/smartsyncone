<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headcount - SmartSyncOne</title>
    <style>
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .upload-section {
            margin: 20px 0;
            padding: 20px;
            border: 2px dashed #ccc;
            border-radius: 5px;
            text-align: center;
        }
        .results-section {
            margin-top: 20px;
        }
        .loader {
            display: none;
            margin: 20px auto;
            border: 5px solid #f3f3f3;
            border-radius: 50%;
            border-top: 5px solid #3498db;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: red;
            margin-top: 10px;
        }
        .success {
            color: green;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Video Headcount Analysis</h1>
        
        <div class="upload-section">
            <input type="file" id="videoInput" accept="video/*">
            <button onclick="uploadVideo()">Process Video</button>
        </div>

        <div id="loader" class="loader"></div>
        <div id="results" class="results-section"></div>
    </div>

    <script>
        // Function to get URL parameters
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            var regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            var results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        };

        async function updateHeadcount(sessionID, headCount) {
            console.log('updateHeadcount called with:', { sessionID, headCount });
            try {
                console.log('Making request to /api/update-headcount');
                const requestBody = JSON.stringify({ sessionID, headCount });
                console.log('Request body:', requestBody);
                
                const response = await fetch('/api/update-headcount', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: requestBody
                });

                console.log('Response status:', response.status);
                const responseText = await response.text();
                console.log('Raw response:', responseText);

                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    console.error('Failed to parse response:', e);
                    throw new Error('Invalid response from server');
                }

                console.log('Update headcount response:', data);
                
                if (!data.success) {
                    throw new Error(data.error || 'Unknown error occurred');
                }

                console.log('Headcount updated successfully');
                return data;
            } catch (error) {
                console.error('Error updating headcount:', error);
                throw error;
            }
        }

        async function uploadVideo() {
            const videoInput = document.getElementById('videoInput');
            const loader = document.getElementById('loader');
            const results = document.getElementById('results');
            const sessionID = getUrlParameter('sessionID');

            console.log('uploadVideo started with sessionID:', sessionID);

            if (!sessionID) {
                console.error('No sessionID provided in URL');
                results.innerHTML = '<p class="error">No session ID provided</p>';
                return;
            }

            if (!videoInput.files || !videoInput.files[0]) {
                console.error('No video file selected');
                results.innerHTML = '<p class="error">Please select a video file</p>';
                return;
            }

            console.log('Video file selected:', videoInput.files[0].name);
            const formData = new FormData();
            formData.append('video', videoInput.files[0]);
            formData.append('sessionID', sessionID);

            loader.style.display = 'block';
            results.innerHTML = '';

            try {
                console.log('Sending video for processing with sessionID:', sessionID);
                const response = await fetch('/api/process-video', {
                    method: 'POST',
                    body: formData
                });

                console.log('Server response status:', response.status);
                const responseText = await response.text();
                console.log('Raw server response:', responseText);

                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    console.error('Failed to parse server response:', e);
                    throw new Error('Invalid response from server');
                }

                console.log('Processed response:', data);
                
                if (data.success) {
                    console.log('Video processed successfully, updating headcount...');
                    const headCount = data.results.max_person_count;
                    console.log('Attempting to update headcount with:', { sessionID, headCount });
                    
                    try {
                        // Update the headcount in the database
                        const updateResult = await updateHeadcount(sessionID, headCount);
                        console.log('Update result:', updateResult);
                        
                        results.innerHTML = `
                            <h2>Results:</h2>
                            <p>Maximum number of persons detected: ${data.results.max_person_count}</p>
                            <p>Average number of persons: ${data.results.avg_person_count}</p>
                            <p class="success">Headcount updated in database</p>
                            <p>Video stored at: <a href="${data.videoUrl}" target="_blank">View Video</a></p>
                        `;
                        console.log('Process completed successfully');
                    } catch (updateError) {
                        console.error('Failed to update headcount:', updateError);
                        results.innerHTML = `
                            <h2>Results:</h2>
                            <p>Maximum number of persons detected: ${data.results.max_person_count}</p>
                            <p>Average number of persons: ${data.results.avg_person_count}</p>
                            <p class="error">Failed to update database: ${updateError.message}</p>
                        `;
                    }
                } else {
                    console.error('Processing failed:', data.error);
                    results.innerHTML = `<p class="error">Error: ${data.error}</p>`;
                }
            } catch (error) {
                console.error('Error in uploadVideo:', error);
                results.innerHTML = `<p class="error">Error: ${error.message}</p>`;
            } finally {
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
