<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - SmartSyncOne</title>
    <style>
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            gap: 20px;
            flex-wrap: wrap;
        }
        .nav-button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .nav-button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="nav-button" onclick="window.location.href='/face-recognition'">
            Go to Face Recognition
        </button>
        <button class="nav-button" onclick="window.location.href='/headcount'">
            Go to Headcount
        </button>
        <button class="nav-button" onclick="window.location.href='/api/session-details'">
            QR Generator
        </button>
        <button class="nav-button" onclick="window.location.href='/api/qr-scanner'">
            QR Scanner
        </button>
    </div>
</body>
</html>
