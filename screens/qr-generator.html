<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - SmartSyncOne</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
    <style>
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .qr-container {
            margin: 30px 0;
        }
        #qrcode {
            margin: 0 auto;
        }
        .info {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #c82333;
        }
        .headcount-btn {
            background-color: #28a745;
            display: none;
        }
        .headcount-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Session QR Code</h1>
        <div class="qr-container">
            <canvas id="qrcode"></canvas>
        </div>
        <div class="info">
            <p><strong>IP Address:</strong> <span id="ipAddress">Loading...</span></p>
            <p><strong>Session ID:</strong> <span id="sessionId">Loading...</span></p>
        </div>
        <button id="stopQR" class="button">Stop QR Session</button>
        <button id="headcountBtn" class="button headcount-btn">Go to Headcount</button>
    </div>

    <script>
        async function getNetworkInfo() {
            try {
                const response = await fetch('/api/network-info');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.error('Error fetching IP:', error);
                return 'Error getting IP';
            }
        }

        async function stopQRSession(sessionId) {
            console.log('Attempting to stop QR session:', sessionId);
            try {
                const stopData = {
                    sessionID: sessionId,
                    qrStop: new Date().toISOString()
                };
                console.log('Stop session payload:', stopData);

                const response = await fetch('/api/session/stop', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(stopData)
                });

                const result = await response.json();
                console.log('Stop session response:', result);

                if (response.ok) {
                    console.log('QR session stopped successfully');
                    document.getElementById('stopQR').style.display = 'none';
                    document.getElementById('headcountBtn').style.display = 'inline-block';
                } else {
                    console.error('Failed to stop QR session:', result.error);
                }
            } catch (error) {
                console.error('Error in stopQRSession:', error);
            }
        }

        async function generateQR() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('sessionId');
            
            if (!sessionId) {
                alert('No session ID provided');
                return;
            }

            document.getElementById('stopQR').onclick = () => stopQRSession(sessionId);
            document.getElementById('headcountBtn').onclick = () => {
                window.location.href = `/headcount?sessionID=${sessionId}`;
            };

            const ipAddress = await getNetworkInfo();
            document.getElementById('ipAddress').textContent = ipAddress;
            document.getElementById('sessionId').textContent = sessionId;

            // Include IP in URL
            const attendanceUrl = `http://localhost:3000/face-recognition?sessionID=${sessionId}&staffIP=${ipAddress}`;
            console.log('Generated URL with IP:', attendanceUrl);
            
            QRCode.toCanvas(document.getElementById('qrcode'), attendanceUrl, {
                width: 300,
                margin: 2
            });
        }

        generateQR();
    </script>
</body>
</html>
