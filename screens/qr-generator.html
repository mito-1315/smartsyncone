<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator - SmartSyncOne</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
    <style>
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        .qr-container {
            margin: 30px 0;
        }
        #qrcode {
            margin: 0 auto;
        }
        .info {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Session QR Code</h1>
        <div class="qr-container">
            <canvas id="qrcode"></canvas>
        </div>
        <div class="info">
            <p><strong>IP Address:</strong> <span id="ipAddress">Loading...</span></p>
            <p><strong>Session ID:</strong> <span id="sessionId">Loading...</span></p>
        </div>
    </div>

    <script>
        async function getNetworkInfo() {
            try {
                const response = await fetch('/api/network-info');
                const data = await response.json();
                return data.ip;
            } catch (error) {
                console.error('Error fetching IP:', error);
                return 'Error getting IP';
            }
        }

        async function generateQR() {
            const urlParams = new URLSearchParams(window.location.search);
            const sessionId = urlParams.get('sessionId');
            
            if (!sessionId) {
                alert('No session ID provided');
                return;
            }

            const ipAddress = await getNetworkInfo();

            document.getElementById('ipAddress').textContent = ipAddress;
            document.getElementById('sessionId').textContent = sessionId;

            // Generate QR code with URL format
            const attendanceUrl = `http://${ipAddress}:3000/attendance?sessionId=${sessionId}`;
            
            QRCode.toCanvas(document.getElementById('qrcode'), attendanceUrl, {
                width: 300,
                margin: 2
            });
        }

        generateQR();
    </script>
</body>
</html>
