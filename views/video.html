<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Head Count Analysis</title>
    <style>
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }
        .progress {
            width: 0%;
            height: 100%;
            background-color: #4CAF50;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        #myVideo {
            max-width: 100%;
            margin: 20px 0;
        }
        #result {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
            border: 1px solid #dee2e6;
        }
        .count-display {
            font-size: 24px;
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Video Head Count Analysis</h1>
    <input type="file" id="videoInput" accept="video/*">
    <video id="myVideo" controls></video>
    <canvas id="myCanvas" style="display: none;"></canvas>
    <button onclick="startAnalysis()" disabled>Start Analysis</button>
    
    <div class="progress-bar" id="progressBar">
        <div class="progress" id="progress"></div>
    </div>
    
    <div id="result" style="display: none;">
        <h2>Analysis Results</h2>
        <p>Maximum Head Count: <span id="maxCount" class="count-display">0</span></p>
        <p>Analysis Status: <span id="analysisStatus">Not started</span></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>
    <script type="module" src="/js/video.js"></script>
</body>
</html>
